<div class="login-container">
  <div class="login-header">
    <h1 class="header-title">Camarones</h1>
    <h2 class="header-subtitle">y sus derivados</h2>
    <div class="header-logo">🦐</div>
  </div>
  
  <div class="login-card">
    <h2 class="login-title">Iniciar sesión</h2>
    
    <!-- Mensajes de estado -->
    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    
    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <input 
          type="email" 
          formControlName="email" 
          placeholder="Ingresa tu correo electrónico"
          class="form-input"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Por favor ingresa un correo válido
        </div>
      </div>
      
      <div class="form-group">
        <input 
          type="password" 
          formControlName="password" 
          placeholder="Ingresa tu Contraseña"
          class="form-input"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          La contraseña debe tener al menos 6 caracteres
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading">Iniciando sesión...</span>
        <span *ngIf="!isLoading">Entrar</span>
      </button>
    </form>
    
    <!-- Botón de prueba rápida -->
    <div class="quick-login">
      <button type="button" class="btn btn-secondary" (click)="quickLogin()">
        Login de prueba (Juan Garcia)
      </button>
    </div>
    
    <div class="register-link">
      <p>¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </div>
  </div>
</div>
